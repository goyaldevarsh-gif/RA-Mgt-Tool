<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RA Disease Activity Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6d28d9">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RA Tracker">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');
  :root {
    --ink:#0f172a; --muted:#64748b; --border:#e2e8f0; --bg:#ffffff; --bg-soft:#f8fafc;
    --accent:#6d28d9; --accent-dark:#5b21b6;
    --amber:#b45309; --amber-bg:#fef3c7; --amber-border:#fde68a;
    --orange:#c2410c; --orange-bg:#ffedd5; --orange-border:#fed7aa;
    --emerald:#047857; --emerald-bg:#d1fae5; --emerald-border:#a7f3d0;
    --red:#b91c1c; --red-bg:#fee2e2; --red-border:#fecaca;
    --slate:#475569; --slate-bg:#f1f5f9; --slate-border:#e2e8f0;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:#fff; color:var(--ink); }
  body { font-family:'Inter',system-ui,sans-serif; font-size:14px; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,.display { font-family:'Plus Jakarta Sans',sans-serif; }
  .mono { font-family:'JetBrains Mono',monospace; }
  #app { max-width:520px; margin:0 auto; min-height:100vh; background:#fff; }
  button, input, select, textarea { font-family:inherit; font-size:inherit; }
  button { cursor:pointer; }
  ::-webkit-scrollbar { display:none; }

  .sticky-top { position:sticky; top:0; z-index:10; background:rgba(255,255,255,0.96); backdrop-filter:blur(6px); border-bottom:1px solid var(--border); }
  .px { padding-left:16px; padding-right:16px; }
  .row { display:flex; align-items:center; }
  .between { justify-content:space-between; }
  .gap2 { gap:8px; } .gap3 { gap:12px; }

  .icon-btn { display:inline-flex; align-items:center; justify-content:center; padding:6px; border-radius:8px; border:none; background:transparent; color:var(--muted); }
  svg.ic { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; display:block; }

  .btn { border-radius:10px; font-weight:700; padding:10px 14px; border:1px solid var(--border); background:#fff; color:var(--ink); font-size:13px; }
  .btn-primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn-primary:disabled { opacity:0.4; }
  .btn-block { width:100%; display:flex; align-items:center; justify-content:center; gap:6px; }
  .btn-sm { padding:6px 10px; font-size:11.5px; border-radius:8px; }
  .btn-danger-confirm { background:#dc2626; color:#fff; border-color:#dc2626; }
  .btn-outline-dashed { border:2px dashed #ddd6fe; color:var(--accent-dark); background:transparent; }

  .search-wrap { position:relative; margin-bottom:8px; }
  .search-wrap svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:#94a3b8; }
  .search-input { width:100%; background:var(--bg-soft); border:1px solid var(--border); border-radius:10px; padding:9px 12px 9px 34px; }

  .chips { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
  .chip { flex-shrink:0; border-radius:999px; border:1px solid var(--border); background:#fff; color:var(--muted); padding:6px 10px; font-size:12px; font-weight:600; white-space:nowrap; }
  .chip.active { background:var(--ink); border-color:var(--ink); color:#fff; }

  .card { border:1px solid var(--border); border-radius:12px; background:#fff; padding:14px; }
  .patient-card { display:flex; align-items:center; justify-content:space-between; width:100%; text-align:left; border:1px solid var(--border); border-radius:12px; background:#fff; padding:14px; box-shadow:0 1px 2px rgba(0,0,0,0.03); }
  .patient-card:active { background:var(--bg-soft); }

  .badge { display:inline-flex; align-items:center; gap:5px; border-radius:999px; border:1px solid; padding:4px 9px; font-size:11px; font-weight:700; }
  .badge-amber { color:var(--amber); background:var(--amber-bg); border-color:var(--amber-border); }
  .badge-emerald { color:var(--emerald); background:var(--emerald-bg); border-color:var(--emerald-border); }
  .badge-red { color:var(--red); background:var(--red-bg); border-color:var(--red-border); }
  .badge-slate { color:var(--slate); background:var(--slate-bg); border-color:var(--slate-border); }
  .badge-orange { color:var(--orange); background:var(--orange-bg); border-color:var(--orange-border); }

  .score-badge { display:inline-flex; flex-direction:column; align-items:flex-start; border-radius:9px; border:1px solid; padding:5px 9px; }
  .score-remission { color:var(--emerald); background:var(--emerald-bg); border-color:var(--emerald-border); }
  .score-low { color:var(--amber); background:var(--amber-bg); border-color:var(--amber-border); }
  .score-moderate { color:var(--orange); background:var(--orange-bg); border-color:var(--orange-border); }
  .score-high { color:var(--red); background:var(--red-bg); border-color:var(--red-border); }
  .score-badge .sv { font-family:'JetBrains Mono',monospace; font-weight:800; font-size:14px; line-height:1.1; }
  .score-badge .sl { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; opacity:0.85; }

  .status-select-amber { color:var(--amber); background:var(--amber-bg); border-color:var(--amber-border); }
  .status-select-emerald { color:var(--emerald); background:var(--emerald-bg); border-color:var(--emerald-border); }
  .status-select-slate { color:var(--slate); background:var(--slate-bg); border-color:var(--slate-border); }
  .overdue-note { font-size:11px; font-weight:700; color:var(--red); margin-top:3px; display:flex; align-items:center; gap:4px; }

  label.field-label { display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:#94a3b8; margin-bottom:5px; }
  .input, .textarea, .select { width:100%; border:1px solid var(--border); border-radius:10px; padding:9px 11px; background:#fff; color:var(--ink); }
  .input:focus, .textarea:focus, .select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 2px rgba(109,40,217,0.15); }
  .textarea { resize:vertical; }

  .seg { display:flex; gap:6px; }
  .seg-btn { flex:1; border:1px solid var(--border); border-radius:9px; padding:9px; font-weight:700; font-size:12.5px; background:#fff; color:var(--muted); }
  .seg-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; }

  .tabs { display:flex; overflow-x:auto; border-top:1px solid #f1f5f9; }
  .tab { flex-shrink:0; display:flex; align-items:center; gap:6px; padding:11px 13px; border-bottom:2px solid transparent; color:#94a3b8; font-weight:700; font-size:12px; background:none; border-left:none; border-right:none; border-top:none; }
  .tab.active { border-bottom-color:var(--accent); color:var(--accent-dark); }

  .stat-card { border:1px solid var(--border); border-radius:12px; padding:12px; background:#fff; }
  .stat-label { font-size:11px; font-weight:700; text-transform:uppercase; color:#94a3b8; }

  .empty-state { display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; margin-top:56px; color:#64748b; }
  .empty-icon-wrap { background:#f5f3ff; border-radius:999px; padding:16px; color:var(--accent); }

  .cspine-alert { border:1.5px solid var(--red-border); background:var(--red-bg); border-radius:12px; padding:10px 12px; font-size:12.5px; color:#7f1d1d; }

  .bottom-bar { position:fixed; bottom:0; left:0; right:0; max-width:520px; margin:0 auto; border-top:1px solid var(--border); background:#fff; padding:10px 12px; display:flex; gap:8px; }

  .save-toast { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); z-index:30; background:rgba(15,23,42,0.92); color:#fff; font-size:11px; font-weight:600; padding:6px 14px; border-radius:999px; display:none; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ===================== Constants ===================== */

const STORAGE_KEY = 'ra-tracker-patients-v1';

const STATUS_CONFIG = {
  active:    { label:'Active',              cls:'amber' },
  remission: { label:'Remission',           cls:'emerald' },
  lost:      { label:'Lost to follow-up',   cls:'slate' },
};

const ICONS = {
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  search:'<circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  back:'<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
  chevron:'<polyline points="9 18 15 12 9 6"/>',
  info:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
  clipboard:'<path d="M9 2h6a1 1 0 0 1 1 1v1H8V3a1 1 0 0 1 1-1z"/><rect x="6" y="4" width="12" height="17" rx="1.5"/><line x1="9" y1="10.5" x2="15" y2="10.5"/><line x1="9" y1="14.5" x2="15" y2="14.5"/>',
  pill:'<path d="M10.5 20.5L3.5 13.5a5 5 0 0 1 7-7l7 7a5 5 0 0 1-7 7z"/><line x1="8.5" y1="8.5" x2="15.5" y2="15.5"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/>',
  alert:'<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>',
};
function ic(name) { return '<svg class="ic" viewBox="0 0 24 24">'+ICONS[name]+'</svg>'; }

/* ===================== Score calculation ===================== */

function calcDAS28ESR(tjc, sjc, esr, ptGlobal100) {
  if (tjc==null || sjc==null || esr==null || ptGlobal100==null || esr<=0) return null;
  return 0.56*Math.sqrt(tjc) + 0.28*Math.sqrt(sjc) + 0.70*Math.log(esr) + 0.014*ptGlobal100;
}
function calcDAS28CRP(tjc, sjc, crpMgL, ptGlobal100) {
  if (tjc==null || sjc==null || crpMgL==null || ptGlobal100==null || crpMgL<0) return null;
  return 0.56*Math.sqrt(tjc) + 0.28*Math.sqrt(sjc) + 0.36*Math.log(crpMgL+1) + 0.014*ptGlobal100 + 0.96;
}
function calcCDAI(tjc, sjc, ptGlobal10, phGlobal10) {
  if (tjc==null || sjc==null || ptGlobal10==null || phGlobal10==null) return null;
  return tjc + sjc + ptGlobal10 + phGlobal10;
}
function calcSDAI(tjc, sjc, ptGlobal10, phGlobal10, crpMgL) {
  if (tjc==null || sjc==null || ptGlobal10==null || phGlobal10==null || crpMgL==null) return null;
  return tjc + sjc + ptGlobal10 + phGlobal10 + (crpMgL/10);
}

function bandDAS28(s) {
  if (s==null) return null;
  if (s < 2.6) return { label:'Remission', cls:'remission' };
  if (s <= 3.2) return { label:'Low activity', cls:'low' };
  if (s <= 5.1) return { label:'Moderate activity', cls:'moderate' };
  return { label:'High activity', cls:'high' };
}
function bandCDAI(s) {
  if (s==null) return null;
  if (s <= 2.8) return { label:'Remission', cls:'remission' };
  if (s <= 10) return { label:'Low activity', cls:'low' };
  if (s <= 22) return { label:'Moderate activity', cls:'moderate' };
  return { label:'High activity', cls:'high' };
}
function bandSDAI(s) {
  if (s==null) return null;
  if (s <= 3.3) return { label:'Remission', cls:'remission' };
  if (s <= 11) return { label:'Low activity', cls:'low' };
  if (s <= 26) return { label:'Moderate activity', cls:'moderate' };
  return { label:'High activity', cls:'high' };
}

function scoreBadgeHtml(label, value, band) {
  if (value == null) return '';
  return '<div class="score-badge score-'+band.cls+'"><span class="sl">'+label+'</span><span class="sv">'+value.toFixed(2)+'</span></div>';
}

function computeVisitScores(v) {
  const das28esr = calcDAS28ESR(v.tjc, v.sjc, v.esr, v.ptGlobal);
  const das28crp = calcDAS28CRP(v.tjc, v.sjc, v.crp, v.ptGlobal);
  const ptGlobal10 = v.ptGlobal!=null ? v.ptGlobal/10 : null;
  const cdai = calcCDAI(v.tjc, v.sjc, ptGlobal10, v.phGlobal);
  const sdai = calcSDAI(v.tjc, v.sjc, ptGlobal10, v.phGlobal, v.crp);
  return { das28esr, das28crp, cdai, sdai };
}

/* ===================== Helpers ===================== */

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(d) { if (!d) return '\u2014'; const dt = new Date(d); if (isNaN(dt)) return '\u2014'; return dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); }
function todayStr() { return new Date().toISOString().slice(0,10); }
function isOverdue(dateStr) { if (!dateStr) return false; const d = new Date(dateStr); if (isNaN(d)) return false; return d < new Date(todayStr()); }
function num(v) { if (v === '' || v === null || v === undefined) return null; const n = Number(v); return isNaN(n) ? null : n; }

function newPatientShape() {
  return {
    id: uid(), name:'', age:'', sex:'F', diagnosis:'', diagnosisDate: todayStr(),
    rf:'unknown', accp:'unknown', status:'active',
    cspineFlag:false, cspineNotes:'',
    nextReviewDate:'', nextLabsDate:'',
    treatment: { dmards:'', biologics:'', steroids:'', nsaids:'' },
    notes:'', visits:[], createdAt: Date.now(),
  };
}

let PATIENTS = [];
function loadPatients() {
  try { const raw = localStorage.getItem(STORAGE_KEY); PATIENTS = raw ? JSON.parse(raw) : []; }
  catch (e) { PATIENTS = []; }
}
function savePatients() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(PATIENTS)); flashSave('saved'); }
  catch (e) { flashSave('error'); }
}
function flashSave(status) {
  const el = document.getElementById('save-toast');
  if (!el) return;
  el.style.display = 'block';
  el.textContent = status === 'saved' ? 'Saved' : 'Save failed \u2014 storage full?';
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { el.style.display = 'none'; }, 1400);
}
function toast(msg) {
  const el = document.getElementById('save-toast');
  if (!el) return;
  el.style.display = 'block'; el.textContent = msg;
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2200);
}
function getPatient(id) { return PATIENTS.find(p => p.id === id); }

/* ===================== Export / Import ===================== */

function exportBackup() {
  try {
    const blob = new Blob([JSON.stringify(PATIENTS, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'ra-tracker-backup-' + todayStr() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Backup downloaded');
  } catch (err) { toast('Backup failed: ' + err.message); }
}
function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const imported = JSON.parse(reader.result);
      if (!Array.isArray(imported)) { toast('Invalid backup file'); return; }
      imported.forEach(p => {
        const idx = PATIENTS.findIndex(x => x.id === p.id);
        if (idx >= 0) PATIENTS[idx] = p; else PATIENTS.push(p);
      });
      savePatients(); render();
      toast('Restored ' + imported.length + ' patient(s)');
    } catch (err) { toast('Import failed: ' + err.message); }
  };
  reader.onerror = () => toast('Could not read file');
  reader.readAsText(file);
}

/* ===================== State ===================== */

let VIEW = 'list';
let SELECTED_ID = null;
let SEARCH = '';
let FILTER_STATUS = 'all';
let TAB = 'overview';
let ARMED_DELETE = null;
let ADD_VISIT_OPEN = false;

/* ===================== Trend chart ===================== */

function renderTrendChart(patient) {
  const visits = patient.visits;
  if (visits.length < 2) return '';
  const w=300, h=150, padL=26, padR=8, padT=10, padB=20;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  const n = visits.length;
  const xFor = i => padL + (n===1?plotW/2:(i/(n-1))*plotW);
  const maxScore = 10; // DAS28 practical max for display
  const yFor = score => padT + (1 - Math.min(score,maxScore)/maxScore) * plotH;
  let grid = '';
  [0,2.6,5.1,8].forEach(v => {
    const y = yFor(v);
    grid += '<line x1="'+padL+'" y1="'+y+'" x2="'+(w-padR)+'" y2="'+y+'" stroke="#e2e8f0" stroke-width="1"/>';
    grid += '<text x="'+(padL-5)+'" y="'+(y+3)+'" font-size="9" fill="#94a3b8" text-anchor="end">'+v+'</text>';
  });
  let xlabels = '';
  const step = n>6 ? Math.ceil(n/6) : 1;
  visits.forEach((v,i) => { if (i%step!==0 && i!==n-1) return; xlabels += '<text x="'+xFor(i)+'" y="'+(h-6)+'" font-size="8.5" fill="#94a3b8" text-anchor="middle">'+fmtDate(v.date).split(' ').slice(0,2).join(' ')+'</text>'; });
  const pts = [];
  visits.forEach((v,i) => {
    const sc = computeVisitScores(v);
    const primary = sc.das28esr!=null ? sc.das28esr : sc.das28crp;
    if (primary!=null) pts.push(xFor(i)+','+yFor(primary));
  });
  let line = '';
  if (pts.length) {
    line = '<polyline points="'+pts.join(' ')+'" fill="none" stroke="#6d28d9" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    visits.forEach((v,i) => { const sc=computeVisitScores(v); const primary = sc.das28esr!=null?sc.das28esr:sc.das28crp; if (primary!=null) line += '<circle cx="'+xFor(i)+'" cy="'+yFor(primary)+'" r="3" fill="#6d28d9"/>'; });
  }
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:150px;">'+grid+line+xlabels+'</svg>'
    + '<p style="font-size:10.5px;color:#94a3b8;margin:4px 0 0;">DAS28 trend (ESR preferred, CRP fallback) \u00b7 dashed lines at remission (2.6) and high-activity (5.1) thresholds</p>';
}

/* ===================== List view ===================== */

function renderListView() {
  const counts = { all: PATIENTS.length };
  Object.keys(STATUS_CONFIG).forEach(k => counts[k] = PATIENTS.filter(p=>p.status===k).length);
  const filtered = PATIENTS.filter(p => {
    if (FILTER_STATUS!=='all' && p.status!==FILTER_STATUS) return false;
    if (SEARCH && !(p.name.toLowerCase().includes(SEARCH.toLowerCase()) || (p.diagnosis||'').toLowerCase().includes(SEARCH.toLowerCase()))) return false;
    return true;
  }).sort((a,b) => {
    const aOver = isOverdue(a.nextReviewDate), bOver = isOverdue(b.nextReviewDate);
    if (aOver !== bOver) return aOver ? -1 : 1;
    return (b.visits.length?new Date(b.visits[b.visits.length-1].date):0) - (a.visits.length?new Date(a.visits[a.visits.length-1].date):0);
  });

  let chips = '<div class="chips">';
  ['all', ...Object.keys(STATUS_CONFIG)].forEach(k => {
    chips += '<button class="chip'+(FILTER_STATUS===k?' active':'')+'" data-action="set-filter" data-value="'+k+'">'+(k==='all'?'All':STATUS_CONFIG[k].label)+' ('+counts[k]+')</button>';
  });
  chips += '</div>';

  let cards = '';
  if (!filtered.length) {
    cards = '<div class="empty-state"><div class="empty-icon-wrap">'+ic('clipboard')+'</div>'
      + '<p style="font-weight:500;">'+(PATIENTS.length===0?'Koi patient abhi tak add nahi hua.':'Is search/filter se koi patient nahi mila.')+'</p>'
      + (PATIENTS.length===0?'<button class="btn btn-primary" style="width:auto;padding:9px 18px;" data-action="go-add">'+ic('plus')+' Add patient</button>':'')
      + '</div>';
  } else {
    cards = '<div style="display:flex;flex-direction:column;gap:10px;">';
    filtered.forEach(p => {
      const last = p.visits[p.visits.length-1];
      const cfg = STATUS_CONFIG[p.status];
      let scoreHtml = '';
      if (last) {
        const sc = computeVisitScores(last);
        const primary = sc.das28esr!=null ? {v:sc.das28esr,label:'DAS28-ESR',band:bandDAS28(sc.das28esr)} : (sc.das28crp!=null ? {v:sc.das28crp,label:'DAS28-CRP',band:bandDAS28(sc.das28crp)} : null);
        if (primary) scoreHtml = scoreBadgeHtml(primary.label, primary.v, primary.band);
      }
      cards += '<button class="patient-card" data-action="open-patient" data-id="'+p.id+'">'

function confirmBtn(action, id) {
  const armed = ARMED_DELETE === action+':'+id;
  if (armed) return '<button class="btn btn-sm btn-danger-confirm" data-action="'+action+'" data-id="'+id+'" data-confirm="1">'+ic('check')+' Confirm</button>';
  return '<button class="icon-btn" data-action="arm-delete" data-arm="'+action+':'+id+'">'+ic('trash')+'</button>';
}

const TABS = [
  {key:'overview', label:'Overview', icon:'info'},
  {key:'visits', label:'Visits', icon:'clipboard'},
  {key:'treatment', label:'Treatment', icon:'pill'},
  {key:'notes', label:'Notes', icon:'file'},
];

function renderDetailView() {
  const p = getPatient(SELECTED_ID);
  if (!p) { VIEW='list'; return renderListView(); }
  let statusOptions = Object.keys(STATUS_CONFIG).map(k=>'<option value="'+k+'"'+(p.status===k?' selected':'')+'>'+STATUS_CONFIG[k].label+'</option>').join('');
  let tabsHtml = TABS.map(t=>'<button class="tab'+(TAB===t.key?' active':'')+'" data-action="set-tab" data-value="'+t.key+'">'+ic(t.icon)+t.label+'</button>').join('');

  let body = '';
  if (TAB==='overview') body = renderOverviewTab(p);
  else if (TAB==='visits') body = renderVisitsTab(p);
  else if (TAB==='treatment') body = renderTreatmentTab(p);
  else if (TAB==='notes') body = renderNotesTab(p);

  return '<div style="padding-bottom:20px;">'
    + '<div class="sticky-top">'
    + '<div class="row gap3 px" style="padding:14px 16px 10px;">'
    + '<button class="icon-btn" data-action="back-to-list">'+ic('back')+'</button>'
    + '<div style="min-width:0;flex:1;"><h2 style="font-size:16px;font-weight:800;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+esc(p.name)+'</h2>'
    + '<p style="font-size:11px;color:#94a3b8;margin:1px 0 0;">'+esc(p.diagnosis||'')+' \u00b7 '+esc(p.sex)+', '+esc(p.age)+'y</p></div>'
    + confirmBtn('delete-patient', p.id)
    + '</div>'
    + '<div class="px" style="padding-bottom:10px;"><select class="select status-select-'+STATUS_CONFIG[p.status].cls+'" style="font-weight:700;" data-field="status">'+statusOptions+'</select></div>'
    + '<div class="tabs px">'+tabsHtml+'</div>'
    + '</div>'
    + body
    + '</div>';
}

/* ===================== Root render ===================== */

function render() {
  const app = document.getElementById('app');
  let html = '';
  if (VIEW === 'list') html = renderListView();
  else if (VIEW === 'add') html = renderAddView();
  else if (VIEW === 'detail') html = renderDetailView();
  app.innerHTML = html + '<div id="save-toast" class="save-toast"></div>';
}

async function patchField(path, value) {
  const p = getPatient(SELECTED_ID);
  if (!p) return;
  if (path.includes('.')) { const [a,b] = path.split('.'); p[a][b] = value; }
  else p[path] = value;
  savePatients();
}

/* ===================== Events ===================== */

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const action = el.dataset.action;

  if (action === 'go-add') { initApTemp(); VIEW='add'; render(); return; }
  if (action === 'cancel-add') { VIEW='list'; render(); return; }
  if (action === 'open-patient') { SELECTED_ID = el.dataset.id; VIEW='detail'; TAB='overview'; ADD_VISIT_OPEN=false; render(); return; }
  if (action === 'back-to-list') { VIEW='list'; render(); return; }
  if (action === 'set-filter') { FILTER_STATUS = el.dataset.value; render(); return; }
  if (action === 'set-tab') { TAB = el.dataset.value; ADD_VISIT_OPEN=false; render(); return; }

  if (action === 'ap-set-sex') { syncApTempFromDom(); AP_TEMP.sex = el.dataset.value; render(); return; }
  if (action === 'ap-set-rf') { syncApTempFromDom(); AP_TEMP.rf = el.dataset.value; render(); return; }
  if (action === 'ap-set-accp') { syncApTempFromDom(); AP_TEMP.accp = el.dataset.value; render(); return; }

  if (action === 'save-patient') {
    syncApTempFromDom();
    if (!AP_TEMP.name.trim()) { toast('Naam zaroori hai'); return; }
    PATIENTS.push(AP_TEMP);
    savePatients();
    VIEW='list'; render();
    return;
  }

  if (action === 'toggle-cspine') { const p=getPatient(SELECTED_ID); p.cspineFlag = !p.cspineFlag; savePatients(); render(); return; }

  if (action === 'open-add-visit') { initAvTemp(); ADD_VISIT_OPEN=true; render(); return; }
  if (action === 'cancel-add-visit') { ADD_VISIT_OPEN=false; render(); return; }
  if (action === 'submit-visit') {
    syncAvTempFromDom();
    const p = getPatient(SELECTED_ID);
    const visit = {
      id: uid(), date: AV_TEMP.date,
      tjc: num(AV_TEMP.tjc), sjc: num(AV_TEMP.sjc), esr: num(AV_TEMP.esr), crp: num(AV_TEMP.crp),
      ptGlobal: num(AV_TEMP.ptGlobal), phGlobal: num(AV_TEMP.phGlobal),
      treatmentNote: AV_TEMP.treatmentNote, radiographicFindings: AV_TEMP.radiographicFindings, notes: AV_TEMP.notes,
    };
    p.visits.push(visit);
    ADD_VISIT_OPEN = false;
    savePatients(); render();
    return;
  }

  if (action === 'arm-delete') {
    ARMED_DELETE = el.dataset.arm; render();
    setTimeout(() => { if (ARMED_DELETE===el.dataset.arm){ ARMED_DELETE=null; render(); } }, 3000);
    return;
  }
  if (action === 'delete-visit' && el.dataset.confirm) {
    const p = getPatient(SELECTED_ID);
    p.visits = p.visits.filter(v => v.id !== el.dataset.id);
    ARMED_DELETE = null; savePatients(); render();
    return;
  }
  if (action === 'delete-patient' && el.dataset.confirm) {
    PATIENTS = PATIENTS.filter(p => p.id !== el.dataset.id);
    ARMED_DELETE = null; savePatients(); VIEW='list'; render();
    return;
  }

  if (action === 'export-backup') { exportBackup(); return; }
  if (action === 'trigger-import') { document.getElementById('import-file-input').click(); return; }
});

document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id && t.id.startsWith('av-') && ADD_VISIT_OPEN) {
    syncAvTempFromDom();
    updateAvScoresDom();
  }
});

document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.id === 'import-file-input') {
    const file = t.files && t.files[0];
    if (file) importBackup(file);
    t.value = '';
    return;
  }
  if (t.dataset && t.dataset.field) {
    patchField(t.dataset.field, t.value);
    if (t.dataset.field === 'status' || t.dataset.field === 'nextReviewDate' || t.dataset.field === 'nextLabsDate') render();
    return;
  }
});

document.addEventListener('blur', (e) => {
  const el = e.target;
  if (!(el instanceof HTMLElement)) return;
  if (el.id === 'search-input') { SEARCH = el.value; render(); return; }
}, true);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target && e.target.id === 'search-input') { SEARCH = e.target.value; render(); }
});

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('service-worker.js').catch(()=>{}); });
}

/* ===================== Init ===================== */

loadPatients();
render();
</script>
</body>
</html>
